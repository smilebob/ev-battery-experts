<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Linear Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Battery Glow Linear Gradient -->
    <linearGradient id="batteryGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="65%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Bolt Gradient -->
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Drop Shadow for GNOME Icon HIG -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.35"/>
    </filter>

    <filter id="innerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#38bdf8" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- GNOME Squircle Base (128x128 standard) -->
  <rect x="8" y="8" width="112" height="112" rx="28" ry="28" fill="url(#bgGrad)" filter="url(#dropShadow)" />

  <!-- Subtle Inner Border Highlight -->
  <rect x="8.5" y="8.5" width="111" height="111" rx="27.5" ry="27.5" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.3" />

  <!-- Background Trend Wave Grid Line -->
  <path d="M 16 86 C 36 86, 44 76, 60 78 C 76 80, 88 64, 112 60" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 3" opacity="0.4" />

  <!-- Battery Terminal / Cap (Top) -->
  <rect x="54" y="22" width="20" height="6" rx="3" ry="3" fill="#94a3b8" />

  <!-- Battery Outer Shell -->
  <rect x="36" y="27" width="56" height="76" rx="12" ry="12" fill="none" stroke="#e2e8f0" stroke-width="4.5" stroke-linejoin="round" />

  <!-- Battery Inner Charge Level (90% capacity filled) -->
  <rect x="42" y="39" width="44" height="58" rx="7" ry="7" fill="url(#batteryGrad)" filter="url(#innerGlow)" />

  <!-- Diagnostic SOH Health Curve across battery -->
  <path d="M 42 68 Q 54 62, 64 66 T 86 52" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.85" />

  <!-- Lightning Bolt Symbol (Energy & Health) -->
  <polygon points="68,43 54,63 64,63 58,83 76,60 66,60" fill="url(#boltGrad)" filter="url(#dropShadow)" />

  <!-- Small Certified Star / Seal (Bottom Right) -->
  <g transform="translate(86, 86)">
    <circle cx="10" cy="10" r="14" fill="#059669" stroke="#ffffff" stroke-width="2" filter="url(#dropShadow)" />
    <!-- Checkmark -->
    <path d="M 5 10 L 9 14 L 16 6" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
