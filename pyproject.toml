[project]
name = "ev-battery-soh"
version = "0.1.0"
description = "EV Battery SOH and Capacity Degradation Analyzer with interactive reports and AI agent skill"
readme = "README.md"
authors = [
    { name = "smilebob", email = "pierre.roth@gmail.com" }
]
license = { text = "BSD-3-Clause" }
requires-python = ">=3.9"
dependencies = [
    "jinja2>=3.1.2",
    "numpy>=1.23.0",
    "pandas>=2.0.0",
    "plotly>=5.15.0",
    "scipy>=1.10.0",
]

[project.scripts]
ev-battery-soh = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
